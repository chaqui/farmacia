# =============================================
# Perfil: PRODUCCIÓN (PostgreSQL)
# =============================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:farmacia}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Sin Flyway: el schema se aplica manualmente con V1__initial_schema.sql
spring.flyway.enabled=false

# Logs reducidos en producción
logging.level.org.springframework.web=WARN
logging.level.org.springframework.boot.actuate=WARN
logging.level.com.inventario=INFO
