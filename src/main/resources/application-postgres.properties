# Postgres datasource configuration (use with profile 'postgres' or via env vars)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/clinicaMedica}
spring.datasource.username=${DB_USER:clinica}
spring.datasource.password=${DB_PASSWORD:CLIN$2026ADMIN}
spring.datasource.driver-class-name=org.postgresql.Driver


# show SQL and format it
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# HikariCP settings (optional tuning)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

# Connection test query for some Postgres setups
spring.datasource.testWhileIdle=true
spring.datasource.validationQuery=SELECT 1

# =====================================================
# Flyway Database Migrations Configuration
# =====================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.placeholder-replacement=false
spring.flyway.sql-migration-prefix=V
spring.flyway.sql-migration-separator=__
spring.flyway.sql-migration-suffixes=.sql

spring.jpa.properties.hibernate.default_batch_fetch_size=50