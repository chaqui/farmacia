spring.datasource.url=jdbc:sqlite:db/farmacia.db
spring.datasource.driverClassName=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.boot.actuate=DEBUG
spring.h2.console.enabled=false
spring.profiles.active=dev
server.port=8085
# Incluir detalles de error (mensaje y stacktrace) en la respuesta y logs
server.error.include-message=always
server.error.include-stacktrace=always
# Loggear detalles de peticiones para depuración (headers, params)
spring.mvc.log-request-details=true
# Ruta para almacenar fotografías subidas (jpg, png)
photos.storage.location=uploads/photos