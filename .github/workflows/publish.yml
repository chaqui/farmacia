name: Publicar imagen en GHCR

on:
  push:
    branches:
      - main
      - master
      - develop
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_BUILDKIT: 1

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest
          buildkitVersion: latest

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Limpiar caché de paquete privado
        run: |
          rm -rf ~/.m2/repository/com/chaqui/general/service-auto-register-client

      - name: Compilar aplicación
        run: |
          ./mvnw clean package \
            -Dmaven.test.skip=true \
            -Dmaven.javadoc.skip=true \
            -s .mvn/settings.xml \
            -U \
            -DskipTests
        env:
          PAT: ${{ secrets.PAT_GITHUB_PACKAGES }}
          MAVEN_OPTS: "-Dorg.slf4j.simpleLogger.defaultLogLevel=WARN -Xms256m -Xmx2048m"

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.PAT_GITHUB_PACKAGES }}

      - name: Extraer metadatos
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PAT=${{ secrets.PAT_GITHUB_PACKAGES }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Mostrar resumen de imagen
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          echo "✅ Imagen publicada en:"
          echo ""
          echo "${{ steps.meta.outputs.tags }}"
